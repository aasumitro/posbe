all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/vektra/mockery/v3/internal/fixtures:
    config:
      all: true
  github.com/aasumitro/posbe/internal/account:
    config:
      all: true
      dir: "./mocks"
      filename: "account_module_mocks.go"
      pkgname: mocks
  github.com/aasumitro/posbe/internal/utils:
    config:
      all: true
      dir: "./mocks"
      filename: "util_module_mocks.go"
      pkgname: mocks
